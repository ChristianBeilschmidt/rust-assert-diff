<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rust assert_eq! Diff Viewer</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        margin: 0;
        padding: 2rem;
      }
      .container {
        max-width: 1400px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }
      textarea {
        width: 100%;
        height: 160px;
        background-color: #1e293b;
        color: #f1f5f9;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 1rem;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.875rem;
        box-sizing: border-box;
      }
      textarea:focus {
        outline: 2px solid #3b82f6;
        border-color: transparent;
      }
      .diff-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        background-color: #1e293b;
        border-radius: 8px;
        padding: 1rem;
        border: 1px solid #334155;
      }
      .diff-pane {
        overflow-x: auto;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.85rem;
        line-height: 1.5;
        white-space: pre;
      }
      .pane-header {
        font-weight: bold;
        padding-bottom: 0.5rem;
        margin-bottom: 0.5rem;
        border-bottom: 1px solid #334155;
      }
      .left-header {
        color: #f87171;
      }
      .right-header {
        color: #4ade80;
      }
      .line {
        display: flex;
        padding: 0 0.25rem;
      }
      .line-num {
        color: #64748b;
        width: 2.5rem;
        flex-shrink: 0;
        select-none: none;
      }
      .diff-del {
        background-color: rgba(239, 68, 68, 0.2);
        color: #fca5a5;
      }
      .diff-add {
        background-color: rgba(34, 197, 94, 0.2);
        color: #86efac;
      }
      .diff-eq {
        color: #94a3b8;
      }
    </style>
  </head>
  <body></body>
</html>
